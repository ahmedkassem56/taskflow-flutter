name: Generate release keystore (one-time)

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore taskflow-release.jks \
            -alias taskflow \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "tf-release-2026" \
            -keypass "tf-release-2026" \
            -dname "CN=Taskflow, OU=Dev, O=Taskflow, L=Cairo, ST=Cairo, C=EG"
      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-release-keystore
          path: taskflow-release.jks
