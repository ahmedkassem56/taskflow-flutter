name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL baked into the APK (e.g. http://192.168.1.110:8000)'
        required: true
        default: 'http://192.168.1.110:8000'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated *.g.dart / *.freezed.dart are committed — no build_runner step needed.
      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ inputs.api_base_url || 'http://192.168.1.110:8000' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
