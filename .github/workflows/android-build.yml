name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL baked into the APK (e.g. http://192.168.1.110:8000)'
        required: true
        default: 'http://192.168.1.110:8000'
      enable_trace:
        description: 'Enable in-app TRACE_ADD debug overlay (diagnose add race)'
        required: false
        default: false
        type: boolean

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Stable release signing (updates without uninstall):
      # - TASKFLOW_KEYSTORE: base64 of the release keystore (created once,
      #   stored as a repo secret)
      # - TASKFLOW_KEYSTORE_PASSWORD / TASKFLOW_KEY_PASSWORD / TASKFLOW_KEY_ALIAS
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.TASKFLOW_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/taskflow-release.jks"
            ls -la "$RUNNER_TEMP/taskflow-release.jks"
          else
            echo "No keystore secret — falling back to debug signing"
          fi

      # Generated *.g.dart / *.freezed.dart are committed — no build_runner step needed.
      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (release)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/taskflow-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.TASKFLOW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TASKFLOW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TASKFLOW_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ inputs.api_base_url || 'http://192.168.1.110:8000' }} --dart-define=TRACE_ADD=${{ inputs.enable_trace || false }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
