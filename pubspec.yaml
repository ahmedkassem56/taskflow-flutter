name: taskflow_app
description: "Taskflow Flutter client (todo / shopping lists)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.0

  # State management (Riverpod with codegen)
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Data models (Freezed)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^14.2.0

  # Storage
  shared_preferences: ^2.3.0

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation (majors: support Dart 3.13 dot-shorthands)
  build_runner: ^2.16.0
  freezed: ^4.0.1
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.8

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
